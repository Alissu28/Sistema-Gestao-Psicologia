<script>
  function toggleSidebar() {
    const sidebar = document.getElementById("sidebar");
    sidebar.classList.toggle("escondida");
  }

  function toggleSubmenu(id) {
    const sidebar = document.getElementById("sidebar");
    if (sidebar.classList.contains('escondida')) {
      sidebar.classList.remove('escondida');
    }
    const sub = document.getElementById(id);
    document.querySelectorAll('.submenu').forEach(s => { if(s.id !== id) s.style.display = 'none'; });
    sub.style.display = (sub.style.display === 'block') ? 'none' : 'block';
  }

  // ====== FUNÇÕES ADICIONADAS PARA ALTERNAR ENTRE LOGIN E RECUPERAÇÃO ======
  function mostrarEsqueciSenha() {
    const boxLogin = document.getElementById("box-login");
    const boxRecuperar = document.getElementById("box-recuperar");
    if (boxLogin && boxRecuperar) {
      boxLogin.style.display = "none";
      boxRecuperar.style.display = "block";
    }
  }

  function mostrarLogin() {
    const boxLogin = document.getElementById("box-login");
    const boxRecuperar = document.getElementById("box-recuperar");
    if (boxLogin && boxRecuperar) {
      boxRecuperar.style.display = "none";
      boxLogin.style.display = "block";
    }
  }

  function ajustarAlturaSidebar() {
    const scroll = document.querySelector('.sidebar-scroll');
    if(scroll) scroll.style.height = (window.innerHeight - 150) + 'px';
  }

  window.addEventListener('resize', ajustarAlturaSidebar);
  window.addEventListener('load', ajustarAlturaSidebar);

  // ====== ENVIAR NOVA SENHA PARA O SERVIDOR ======
  function redefinirSenhaUsuario() {
    const emailField = document.getElementById("rec_email");
    const senhaField = document.getElementById("rec_senha");
    
    if (!emailField || !senhaField) return;
    
    const email = emailField.value.trim();
    const senha = senhaField.value.trim();
    
    if (email === "" || senha === "") {
      alert("⚠️ Por favor, preencha o e-mail e a nova senha!");
      return;
    }
    
    // Altera o texto do botão para dar feedback visual
    const btn = document.querySelector("#box-recuperar .btn-login-premium");
    const textoOriginal = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Salvando...';
    
    // Chama o servidor no Código.gs para salvar no banco
    google.script.run
      .withSuccessHandler(function(resultado) {
        btn.disabled = false;
        btn.innerHTML = textoOriginal;
        
        // Altere aqui caso seu servidor retorne outra estrutura (ex: resultado.sucesso)
        if (resultado) {
          alert("✅ Senha redefinida com sucesso!");
          emailField.value = "";
          senhaField.value = "";
          mostrarLogin(); // Volta para a tela de login
        } else {
          alert("❌ Erro: Usuário não encontrado ou e-mail inválido.");
        }
      })
      .withFailureHandler(function(erro) {
        btn.disabled = false;
        btn.innerHTML = textoOriginal;
        console.error(erro);
        alert("❌ Falha na comunicação com o servidor.");
      })
      .alterarSenhaNoServidor(email, senha); // <--- ATENÇÃO: Confirme se no seu Código.gs o nome é exatamente esse!
  }
</script>
</body>
