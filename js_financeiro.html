<script>
/**
 * 1. INTERFACE PRINCIPAL PREMIUM
 */
function showFinanceiro() {
  const main = document.getElementById("main");
  if (!main) return;

  main.innerHTML = `
    <div class="fin-container-premium">
      
      <div class="fin-header-premium">
        <div style="display: flex; align-items: center; gap: 16px;">
          <div class="fin-icon-box-premium">
            <i class="fa-solid fa-file-invoice-dollar"></i>
          </div>
          <div>
            <h2 style="color: #0f172a; font-weight: 800; margin: 0; font-size: 24px; letter-spacing: -0.5px;">Faturamento e IR</h2>
            <p style="color: #64748b; font-size: 14px; margin: 4px 0 0 0; font-weight: 500;">Controle de emissão e registros fiscais por responsável.</p>
          </div>
        </div>
        <button onclick="showDashboard()" class="btn-fin-back-premium">
          <i class="fa-solid fa-arrow-left"></i> Voltar
        </button>
      </div>

      <div class="filter-box-financeiro-premium">
        <div style="flex: 2; min-width: 250px;">
          <label class="filter-label-premium">Período de Referência:</label>
          <div style="display: flex; gap: 10px; margin-top: 6px;">
            <select id="f_mes" onchange="buscarDadosFinanceiros()" class="input-field-fin-premium select-fin-secure-premium" style="flex: 2;">
              <option value="">Todos os meses</option>
              <option value="/01/">Janeiro</option><option value="/02/">Fevereiro</option><option value="/03/">Março</option>
              <option value="/04/">Abril</option><option value="/05/">Maio</option><option value="/06/">Junho</option>
              <option value="/07/">Julho</option><option value="/08/">Agosto</option><option value="/09/">Setembro</option>
              <option value="/10/">Outubro</option><option value="/11/">Novembro</option><option value="/12/">Dezembro</option>
            </select>
            <input type="number" id="f_ano" oninput="buscarDadosFinanceiros()" value="2026" class="input-field-fin-premium" style="flex: 1; text-align: center;">
          </div>
        </div>
        <div style="flex: 1; min-width: 150px; display: flex; align-items: flex-end;">
           <button onclick="exportarPDF()" class="btn-fin-pdf-premium">
             <i class="fa-solid fa-file-pdf"></i> Exportar PDF
           </button>
        </div>
      </div>

      <div id="containerTabela" class="fin-table-card-premium">
        <div id="areaLoading" style="padding: 80px 20px; text-align: center; color: #94a3b8;">
           <div class="spinner-premium"></div>
           <p style="font-size: 15px; font-weight: 600; color: #475569; margin: 16px 0 4px 0;">Sincronizando com as abas SESSOES e PACIENTES...</p>
           <small style="color: #94a3b8; font-weight: 500;">Isso pode levar alguns segundos dependendo da sua conexão.</small>
        </div>
      </div>

    </div>
  `;
  buscarDadosFinanceiros();
}

/**
 * 2. BUSCA E TRATAMENTO DE DADOS (PRESERVADO)
 */
function buscarDadosFinanceiros() {
  const container = document.getElementById("containerTabela");
  const mes = document.getElementById("f_mes").value;
  const ano = document.getElementById("f_ano").value;
  if (!container) return;

  google.script.run
    .withSuccessHandler(dados => {
      if (!dados || (Array.isArray(dados) && dados.length === 0)) {
        container.innerHTML = `
        <div style="padding: 80px 20px; text-align: center; color: #64748b;">
          <div style="font-size: 40px; margin-bottom: 12px;">📅</div>
          <p style="font-weight: 700; color: #1e293b; margin: 0 0 4px 0;">Nenhuma sessão "Realizada" encontrada.</p>
          <p style="font-size: 13px; color: #64748b; margin: 0; font-weight: 500;">Verifique o status na planilha SESSOES.</p>
        </div>`;
        return;
      }

      if (dados.erro) {
        container.innerHTML = `
        <div style="padding: 60px 20px; text-align: center; color: #dc2626; background: #fef2f2; border-radius: 12px;">
          <p style="font-weight: 800; margin: 0 0 6px 0;">❌ Erro na Planilha:</p>
          <p style="font-size: 14px; font-weight: 500; margin: 0;">${dados.erro}</p>
        </div>`;
        return;
      }

      renderizarGradeFinanceira(dados, mes, ano);
    })
    .withFailureHandler(err => {
      container.innerHTML = `
      <div style="padding: 60px 20px; text-align: center; color: #dc2626;">
        <p style="font-weight: 800; margin: 0 0 6px 0;">❌ Falha de Comunicação:</p>
        <p style="font-size: 13px; font-weight: 500; margin: 0;">${err}</p>
      </div>`;
    })
    .listarSessoesComResponsavel(); 
}

/**
 * 3. MONTA A TABELA COM INPUTS REESTILIZADOS
 */
function renderizarGradeFinanceira(dados, mes, ano) {
  const container = document.getElementById("containerTabela");
  if (!container) return;
  
  let html = `
    <div style="overflow-x: auto; width: 100%;">
      <table style="width: 100%; border-collapse: collapse; text-align: left; font-size: 14px;">
        <thead>
          <tr style="background: #f8fafc; border-bottom: 1px solid #e2e8f0;">
            <th style="padding: 16px 20px; font-size: 11px; font-weight: 800; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px;">Paciente / Identificação</th>
            <th style="padding: 16px 20px; font-size: 11px; font-weight: 800; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px;">Detalhes da Sessão</th>
            <th style="padding: 16px 20px; font-size: 11px; font-weight: 800; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px;">Dados para Recibo (Pagador)</th>
            <th style="padding: 16px 20px; font-size: 11px; font-weight: 800; color: #64748b; text-transform: uppercase; text-align: center; letter-spacing: 0.5px; width: 140px;">Ação</th>
          </tr>
        </thead>
        <tbody>
  `;

  let exibidos = 0;
  dados.forEach((item, i) => {
    if ((mes && !item.data.includes(mes)) || (ano && !item.data.endsWith(ano))) return;
    exibidos++;

    const nomeSugerido = (item.responsavel && item.responsavel.trim() !== "") ? item.responsavel : item.paciente;

    html += `
      <tr id="linha_${i}" class="row-fin-premium" style="border-bottom: 1px solid #f1f5f9; transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);">
        <td style="padding: 18px 20px;">
          <div style="font-weight: 700; color: #0f172a; font-size: 14px;">${item.paciente}</div>
          <div style="font-size: 11px; color: #94a3b8; margin-top: 4px; font-weight: 600;">CPF: ${item.cpfPaciente || 'Não informado'}</div>
        </td>
        <td style="padding: 18px 20px;">
          <span class="badge-date-fin-premium"><i class="fa-regular fa-calendar-check" style="margin-right: 4px;"></i>${item.data}</span>
          <div style="font-weight: 800; color: #059669; font-size: 16px; margin-top: 6px;">R$ ${item.valor}</div>
        </td>
        <td style="padding: 18px 20px;">
          <div style="display: flex; flex-direction: column; gap: 6px;">
            <input type="text" id="nome_pag_${i}" value="${nomeSugerido}" placeholder="Nome do Responsável" class="input-table-field-premium" style="width: 240px;">
            <input type="text" id="cpf_pag_${i}" value="" placeholder="CPF do Pagador" class="input-table-field-premium" style="width: 160px; font-size: 12px; padding: 6px 10px;">
          </div>
        </td>
        <td style="padding: 18px 20px; text-align: center;">
          <button id="btn_reg_${i}" onclick="processarRegistro(${i}, '${item.paciente.replace(/'/g, "\\'")}', '${item.valor}', '${item.data}', '${item.cpfPaciente}')" class="btn-confirm-row-premium">
            Confirmar
          </button>
        </td>
      </tr>
    `;
  });

  if (exibidos === 0) {
    container.innerHTML = `
      <div style="padding: 80px 20px; text-align: center; color: #64748b; font-weight: 500;">
        <i class="fa-solid fa-receipt" style="font-size: 32px; color: #cbd5e1; margin-bottom: 12px; display: block;"></i>
        Nenhum registro encontrado para os filtros aplicados.
      </div>`;
  } else {
    container.innerHTML = html + `</tbody></table></div>`;
  }
}

/**
 * 4. ENVIA OS DADOS E DISPARA O DESLIZAMENTO DA LINHA (PRESERVADO)
 */
function processarRegistro(idx, nomePac, valor, data, cpfPac) {
  const nomePag = document.getElementById(`nome_pag_${idx}`).value;
  const cpfPag = document.getElementById(`cpf_pag_${idx}`).value;
  const btn = document.getElementById(`btn_reg_${idx}`);
  const linha = document.getElementById(`linha_${idx}`);

  if (!cpfPag || !nomePag) {
    alert("⚠️ Atenção: O Nome e o CPF do pagador são obrigatórios para consolidação fiscal.");
    return;
  }

  btn.disabled = true;
  btn.style.background = "#cbd5e1";
  btn.style.color = "#94a3b8";
  btn.style.boxShadow = "none";
  btn.innerHTML = "<i class='fa-solid fa-circle-notch fa-spin'></i>";

  google.script.run.withSuccessHandler(res => {
    if (res.sucesso) {
      btn.style.background = "#ecfdf5";
      btn.style.color = "#10b981";
      btn.style.border = "1px solid rgba(16, 185, 129, 0.2)";
      btn.innerHTML = "<i class='fa-solid fa-check'></i> Salvo!";
      
      linha.style.opacity = "0";
      linha.style.transform = "translateX(30px)";
      
      setTimeout(() => {
        linha.style.display = "none";
        const linhasRestantes = document.querySelectorAll('.row-fin-premium:not([style*="display: none"])');
        if (linhasRestantes.length === 0) {
          document.getElementById("containerTabela").innerHTML = 
            `<div style="padding: 80px 20px; text-align: center; color: #10b981; font-weight: 700; font-size: 15px;">
               <i class="fa-solid fa-circle-check" style="font-size: 36px; margin-bottom: 12px; display:block;"></i>
               Tudo pronto! Todos os registros pendentes foram processados.
             </div>`;
        }
      }, 500);

    } else {
      alert("❌ Erro ao gravar no banco: " + res.erro);
      btn.disabled = false;
      btn.style.background = "#8b5cf6";
      btn.style.color = "white";
      btn.innerText = "Confirmar";
    }
  }).salvarRegistroFiscalCompleto({
    paciente: nomePac,
    cpfPaciente: cpfPac,
    valor: valor,
    dataSessao: data,
    nomePagador: nomePag,
    cpfPagador: cpfPag
  });
}

/**
 * 5. LOGICA DO BOTÃO GERAR RELATORIO (PRESERVADO)
 */
function exportarPDF() {
  const mes = document.getElementById("f_mes").value;
  const ano = document.getElementById("f_ano").value;

  alert("📄 Gerando arquivo do Livro Caixa em PDF. Aguarde a sincronização direta com as abas...");

  google.script.run
    .withSuccessHandler(function(urlBase64) {
      if (urlBase64 && urlBase64.startsWith("Erro")) {
        alert(urlBase64);
        return;
      }
      const novaAba = window.open();
      if(novaAba) {
         novaAba.document.write('<iframe src="' + urlBase64 + '" frameborder="0" style="border:0; top:0px; left:0px; bottom:0px; right:0px; width:100%; height:100%;" allowfullscreen></iframe>');
      } else {
         alert("⚠️ Pop-up bloqueada. Por favor, autorize abas secundárias nas configurações do navegador.");
      }
    })
    .withFailureHandler(function(erro) {
      alert("Erro crítico de comunicação com o servidor: " + erro.message);
    })
    .gerarPDFDoHistoricoGeral(mes, ano);
}

function logFinanceiro(acao, detalhes) {
  google.script.run.salvarNoBancoDeLogs({
    modulo: "FINANCEIRO",
    acao: acao,
    detalhes: detalhes,
    usuario: "ADM"
  });
}
</script>
