<script>
/**
 * TELA DE LOGS - GESTÃO DE AUDITORIA
 */
function showLogs() {
  if (window.perfilLogado !== 'ADMIN') {
    document.getElementById("main").innerHTML = `
      <div class="card" style="text-align:center; padding: 50px;">
        <h2 style="color:#7f1d1d">🚫 Acesso Negado</h2>
        <p>Apenas administradores podem acessar os logs de auditoria.</p>
      </div>`;
    return;
  }

  document.getElementById("main").innerHTML = `
    <div class="card" style="max-width: 100%; height: 90vh; display: flex; flex-direction: column;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2 class="title" style="margin:0;">🕵️ Logs do Sistema</h2>
        <button class="btn" onclick="showLogs()" style="background:#64748b; font-size: 12px;">🔄 Atualizar</button>
      </div>
      
      <div class="table-container" style="flex: 1; overflow-y: auto; border: 1px solid #e2e8f0; border-radius: 8px;">
        <div id="listaLogs">
          <p style="padding: 20px; text-align: center; color: #64748b;">⏳ Carregando trilha de auditoria...</p>
        </div>
      </div>
    </div>`;

  google.script.run
    .withSuccessHandler(function(data) {
      var logs = (data || []).slice(1).reverse();
      renderizarLogs(logs);
    })
    .withFailureHandler(function(erro) {
      document.getElementById("listaLogs").innerHTML = `<p style="color:red; padding:20px;">Erro: ${erro.message}</p>`;
    })
    .listarLogs();
}

function renderizarLogs(lista) {
  if (lista.length === 0) {
    document.getElementById("listaLogs").innerHTML = `<p style="padding: 20px; text-align: center;">Nenhum registro encontrado.</p>`;
    return;
  }

  var html = `
    <table style="width: 100%; border-collapse: collapse; font-size: 13px;">
      <thead>
        <tr style="background: #f8fafc; position: sticky; top: 0; z-index: 10;">
          <th style="padding: 12px; text-align: left; border-bottom: 2px solid #e2e8f0;">Data/Hora</th>
          <th style="padding: 12px; text-align: left; border-bottom: 2px solid #e2e8f0;">Usuário</th>
          <th style="padding: 12px; text-align: center; border-bottom: 2px solid #e2e8f0;">Ação</th>
          <th style="padding: 12px; text-align: left; border-bottom: 2px solid #e2e8f0;">Módulo</th>
          <th style="padding: 12px; text-align: left; border-bottom: 2px solid #e2e8f0;">Detalhes</th>
        </tr>
      </thead>
      <tbody>`;

  lista.forEach(function(L) {
    var dataFormatada = L[1] ? new Date(L[1]).toLocaleString('pt-BR') : "-";
    var usuario = L[2] || "-";
    var acao = L[3] || "-";
    var modulo = L[4] || "-";
    var detalhes = L[6] || "-";

    // Cores automáticas
    var bg = "#f1f5f9"; 
    if (acao.includes("SALVAR") || acao.includes("EVOLUÇÃO")) bg = "#dcfce7";
    if (acao.includes("EXCLUIR") || acao.includes("CANCELAR")) bg = "#fee2e2";

    html += `
      <tr style="border-bottom: 1px solid #f1f5f9;">
        <td style="padding: 10px; color: #64748b;">${dataFormatada}</td>
        <td style="padding: 10px; font-weight: bold;">${usuario}</td>
        <td style="padding: 10px; text-align: center;">
          <span style="background:${bg}; padding:3px 8px; border-radius:10px; font-size:10px; font-weight:bold;">${acao}</span>
        </td>
        <td style="padding: 10px;">${modulo}</td>
        <td style="padding: 10px; font-size: 12px; color: #334155;">${detalhes}</td>
      </tr>`;
  });

  html += `</tbody></table>`;
  document.getElementById("listaLogs").innerHTML = html;
}
</script>
