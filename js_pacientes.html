const itensPorPagina = 10;

       pacientesGlobais = dados || [];

/**
 * FUNÇÃO DE RENDERIZAÇÃO DA TABELA BASEADA NA PÁGINA ATUAL E FILTROS
 */
function renderizarListaPaginada() {
  const container = document.getElementById("containerTabelaPacientes");
  if (!container) return;

  if (pacientesFiltrados.length === 0) {
    container.innerHTML = `
      <div style="text-align:center; padding:80px; background:white; border-radius:16px;">
        <div style="font-size: 48px; margin-bottom: 15px; color: #cbd5e1;"><i class="fa-solid fa-magnifying-glass"></i></div>
        <h3 style="color:#1e293b; margin-bottom:6px; font-weight:700;">Nenhum paciente encontrado</h3>
        <p style="color:#64748b; font-size:14px;">Tente digitar outro nome ou limpe o campo de pesquisa.</p>
      </div>`;
    return;
  }

  // Cálculos baseados na lista filtrada atual
  const totalItens = pacientesFiltrados.length;
  const totalPaginas = Math.ceil(totalItens / itensPorPagina);
  
  if (paginaAtual > totalPaginas) paginaAtual = totalPaginas;
  if (paginaAtual < 1) paginaAtual = 1;

  const indiceInicio = (paginaAtual - 1) * itensPorPagina;
  const indiceFim = Math.min(indiceInicio + itensPorPagina, totalItens);
  const itensDaPagina = pacientesFiltrados.slice(indiceInicio, indiceFim);

  let html = `
    <table class="psi-table" id="tabelaDadosPacientes">
      <thead>
        <tr>
          <th style="width: 35%;">Nome do Paciente</th>
          <th style="width: 20%;">CPF</th>
          <th style="width: 20%;">Dados Clínicos</th>
          <th style="width: 13%;">Status</th>
          <th style="width: 12%; text-align: right;">Ações</th>
        </tr>
      </thead>
      <tbody>`;

  itensDaPagina.forEach(p => {
    const nome = p[1] ? p[1].toString().toUpperCase() : "---";
    const statusRaw = (p[10] || "ATIVO").trim().toUpperCase();
    
    let classePremium = "status-ativo-premium";
    if (statusRaw === "INATIVO") classePremium = "status-inativo-premium";
    if (statusRaw === "ALTA" || statusRaw === "DE ALTA") classePremium = "status-alta-premium";

    html += `
      <tr>
        <td>
          <div style="font-weight: 700; color: #0f172a; font-size: 15px;">${nome}</div>
        </td>
        <td>
          <div style="font-weight: 600; color: #64748b; font-size: 14px;">${p[3] || '---'}</div>
        </td>
        <td>
          <div style="margin-bottom: 4px; font-size:14px; color:#334155;"><i class="fa-regular fa-calendar" style="color:#94a3b8; margin-right:4px;"></i> <b>${p[6] || '---'}</b></div>
          <div style="font-size: 12px; color: #94a3b8; font-weight:500;"><i class="fa-regular fa-user" style="margin-right:4px;"></i> ${p[7] || '---'}</div>
        </td>
        <td>
          <span class="badge-status-premium ${classePremium}">${statusRaw}</span>
        </td>
        <td style="text-align: right;">
          <div class="actions-flex">
            <button class="btn-action-table edit" title="Editar Informações" onclick="editarPaciente('${p[0]}')">
              <i class="fa-solid fa-pen-to-square"></i>
            </button>
            <button class="btn-action-table delete" title="Excluir Paciente" onclick="deletarPaciente('${p[0]}', '${nome}')">
              <i class="fa-solid fa-trash-can"></i>
            </button>
          </div>
        </td>
      </tr>`;
  });

  html += `</tbody></table>`;

  // Só renderiza a barra de paginação se houver mais de uma página de resultados
  if (totalPaginas > 1) {
    html += `
      <div class="pagination-container">
        <div class="pagination-info">
          Mostrando <b>${indiceInicio + 1}</b> a <b>${indiceFim}</b> de <b>${totalItens}</b> pacientes
        </div>
        <div class="pagination-buttons">
          <button class="btn-page" id="btnPagAnt" onclick="mudarPagina(-1)" ${paginaAtual === 1 ? 'disabled' : ''}>
            <i class="fa-solid fa-chevron-left"></i> Anterior
          </button>
          <div style="display:flex; align-items:center; padding: 0 10px; font-size:14px; font-weight:700; color:#475569;">
            Página ${paginaAtual} de ${totalPaginas}
          </div>
          <button class="btn-page" id="btnPagProx" onclick="mudarPagina(1)" ${paginaAtual === totalPaginas ? 'disabled' : ''}>
            Próximo <i class="fa-solid fa-chevron-right"></i>
          </button>
        </div>
      </div>
    `;
  } else if (totalItens > 0 && totalItens < pacientesGlobais.length) {
    // Caso especial: mostrando resultados filtrados em uma única página curta
    html += `
      <div class="pagination-container">
        <div class="pagination-info">
          Encontrado(s) <b>${totalItens}</b> registro(s) correspondente(s) à busca.
        </div>
      </div>`;
  }

  container.innerHTML = html;
}

/**
 * NAVEGAÇÃO ENTRE PÁGINAS
 */
function mudarPagina(direcao) {
  paginaAtual += direcao;
  renderizarListaPaginada();
}

/**
 * NOVO FILTRO GLOBAL INTEGRADO (BUSCA EM TODAS AS PÁGINAS)
 */
function filtrarPacientesLista() {
  const input = document.getElementById("inputBusca");
  if (!input) return;
  
  const termoBusca = input.value.toUpperCase().trim();
  
  if (termoBusca === "") {
    // Se a busca estiver vazia, restaura a lista padrão e mantém a página 1
    pacientesFiltrados = [...pacientesGlobais];
  } else {
    // Filtra a lista completa de pacientes (independente de onde eles estejam na paginação)
    pacientesFiltrados = pacientesGlobais.filter(p => {
      const nomePaciente = p[1] ? p[1].toString().toUpperCase() : "";
      return nomePaciente.indexOf(termoBusca) > -1;
    });
  }
  
  // Reseta sempre para a primeira página ao buscar para evitar telas vazias
  paginaAtual = 1;
  renderizarListaPaginada();
}

/**
 * CARREGA REGISTRO E CHAMA FORMULÁRIO EM MODO DE EDIÇÃO
 */
function editarPaciente(id) {
  google.script.run
    .withSuccessHandler(function(paciente) {
      if (!paciente) {
        alert("⚠️ Erro: Registro do paciente não pôde ser localizado!");
        return;
      }

      abrirFormPaciente();

      setTimeout(function() {
        document.getElementById("p_id").value = paciente.id || "";
        document.getElementById("p_nome").value = paciente.nome || "";
        document.getElementById("p_responsavel").value = paciente.responsavel || "";
        document.getElementById("p_nascimento").value = paciente.nascimento || "";
        document.getElementById("p_sexo").value = paciente.sexo || "Masculino";
        document.getElementById("p_cpf").value = paciente.cpf || "";
        document.getElementById("p_rg").value = paciente.rg || "";
        document.getElementById("p_telefone").value = paciente.telefone || "";
        document.getElementById("p_endereco").value = paciente.endereco || "";
        document.getElementById("p_valor").value = paciente.valorSessao || "";
        document.getElementById("p_status").value = paciente.status || "Ativo";
        
        const headerTitle = document.querySelector(".cadastro-header");
        if(headerTitle) headerTitle.innerHTML = "<i class='fa-solid fa-user-pen' style='color:#8b5cf6;'></i> Atualizar Cadastro do Paciente";

        const btn = document.querySelector(".btn-cadastrar-submit");
        if(btn) btn.innerHTML = "<i class='fa-solid fa-floppy-disk'></i> ATUALIZAR REGISTRO";
      }, 150); 
    })
    .getPacientePorId(id);
}

/**
 * CAPTURA FORMULÁRIO E SALVA COM FEEDBACK VISUAL PREMIUM
 */
function salvarPaciente() {
  const btn = document.querySelector(".btn-cadastrar-submit");

  const d = {
    id: document.getElementById("p_id").value,
    nome: document.getElementById("p_nome").value,
    responsavel: document.getElementById("p_responsavel").value, 
    nascimento: document.getElementById("p_nascimento").value,
    sexo: document.getElementById("p_sexo").value,
    cpf: document.getElementById("p_cpf").value,
    rg: document.getElementById("p_rg").value,
    telefone: document.getElementById("p_telefone").value,
    email: "", 
    endereco: document.getElementById("p_endereco").value,
    valor: document.getElementById("p_valor").value,
    status: document.getElementById("p_status") ? document.getElementById("p_status").value : "Ativo",
    obs: "" 
  };

  if(!d.nome) {
    alert("⚠️ O campo Nome do Paciente é obrigatório para o registro!");
    return;
  }

  if(btn) {
    btn.disabled = true;
    btn.innerHTML = "<i class='fa-solid fa-circle-notch fa-spin'></i> Salvando...";
  }

  google.script.run
    .withSuccessHandler(res => {
      if(res.sucesso) {
        alert("✅ Prontuário do paciente updated/saved com sucesso!");
        if (typeof showPacientes === 'function') showPacientes();
      } else {
        alert("❌ Falha na gravação: " + res.erro);
        if(btn) {
          btn.disabled = false;
          btn.innerHTML = "<i class='fa-solid fa-floppy-disk'></i> GRAVAR DADOS";
        }
      }
    })
    .withFailureHandler(err => {
      alert("❌ Falha crítica de rede: " + err);
      if(btn) {
        btn.disabled = false;
        btn.innerHTML = "<i class='fa-solid fa-floppy-disk'></i> GRAVAR DADOS";
      }
    })
    .salvarNovoPaciente(d); 
}

function deletarPaciente(id, nome) {
  if (!confirm("⚠️ CONFIRMAÇÃO EXIGIDA:\n\nDeseja realmente excluir permanentemente o cadastro e histórico do(a) paciente " + nome + "? Esta ação não poderá ser desfeita.")) {
    return;
  }

  google.script.run
    .withSuccessHandler(res => {
      if(res.sucesso) {
        alert("🗑️ Registro do paciente excluído do ecossistema!");
        if (typeof showPacientes === 'function') showPacientes();
      } else {
        alert("❌ Falha ao tentar excluir: " + res.erro);
      }
    })
    .withFailureHandler(err => {
      alert("❌ Falha na comunicação técnica: " + err);
    })
    .excluirPacienteSistema(id, nome);
}
</script>
